name: Momentum Screener (Manual)

# Deliberately manual only -- no schedule/cron. Trigger from the Actions
# tab whenever you want a Momentum run. Fully decoupled from the Contra +
# Sector workflow: running one never triggers the other.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this manual run (shows in the run log)"
        required: false
        default: ""

jobs:
  run-momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Own cache namespace (momentum-v1) so this workflow can never collide
      # with or depend on the Contra workflow's cache state. Uses the same
      # real ISO-week string fix (github.run_date is not a valid context).
      - name: Set cache key
        id: cachekey
        run: echo "week=$(date +'%G-W%V')" >> "$GITHUB_OUTPUT"

      - name: Cache momentum data
        uses: actions/cache@v4
        with:
          path: /tmp/momentum_cache
          key: momentum-v1-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            momentum-v1-
          save-always: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Momentum screener
        env:
          # Confirmed from sheets_io.py -- get_gspread_client() reads this exact name.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # telegram_notify.py pulls TELEGRAM_TOKEN / TELEGRAM_CHAT_ID from config.py,
          # not directly from env -- these names must match whatever config.py itself
          # reads from os.environ. Copy the exact secret names your existing Contra
          # workflow uses for this same step.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Manual run note: ${{ github.event.inputs.note }}"
          python main_momentum.py
